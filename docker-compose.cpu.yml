# =============================================================================
# GPU を使わずに起動するための上書き設定
#
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d
#
# こんなときに使う:
#   - GPU が無い PC で動かす
#   - NVIDIA ドライバがまだ入っていない / 壊れている
#     （`failed to initialize NVML: ERROR_LIBRARY_NOT_FOUND` で起動できない）
#
# `docker-compose.yml` を書き換えないので、git で更新を取り込んでも衝突しない。
# アノテーション・データ整備・推論結果の確認は問題なく行える。
# **学習だけは数十倍遅くなる**ので、GPU のある PC で学習したモデルを
# データ管理タブから取り込む使い方を勧める。
#
# GPU を使えるようにする手順は docs/docker_setup.md を参照。
# =============================================================================
services:
  streamlit_app:
    # GPU の予約をまるごと取り消す。
    # **`!reset` を使うこと。** deploy.resources.reservations.devices は配列なので、
    # 普通に上書きしようとすると「追記」になり GPU の要求が残ってしまう。
    # （`!reset` は Docker Compose 2.24 以降。それより古い場合は
    #   docker-compose.yml の該当ブロックを手で消してください）
    deploy: !reset null

    environment:
      # **これも消さないと GPU なしでは起動できない。**
      # nvidia-container-runtime は deploy の指定だけでなく、
      # この環境変数を見ただけで GPU を注入しようとする。
      # deploy を消しても `NVIDIA_VISIBLE_DEVICES=all` が残っていると
      # `failed to initialize NVML: ERROR_LIBRARY_NOT_FOUND` のままになる（実際に踏んだ）。
      # "void" は「何も注入しない」を意味する予約語（空文字でも同じ）。
      NVIDIA_VISIBLE_DEVICES: "void"
