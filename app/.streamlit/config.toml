# =============================================================================
# Streamlit の設定（コンテナでは /app/.streamlit/config.toml として読まれる）
# =============================================================================
[server]
# アップロードの上限（MB）。既定の 200MB だと、データセットの ZIP や
# 学習 run 一式の ZIP が取り込めないことがある。
# アップロードされたファイルは**メモリに載る**ので、むやみに上げないこと。
# これより大きいものは、ホストの data/ や models/ に直接置けば UI から見える。
maxUploadSize = 4096
