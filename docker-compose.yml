# =============================================================================
# detection_dev_ui - Docker Compose 統合設定
# Ubuntu 22.04 / GPU対応 (NVIDIA Container Toolkit 必須)
# CVAT: v2.64.0 (cvat-sdk と同一バージョンに固定)
#
# cvat_* のサービス定義は CVAT 公式の docker-compose.yml を元に構成している。
#   https://github.com/cvat-ai/cvat  (Copyright (C) CVAT.ai Corporation / MIT License)
# =============================================================================

version: "3.8"

# ---------------------------------------------------------------------------
# 共有ボリューム定義
# ---------------------------------------------------------------------------
volumes:
  # CVAT 内部データ
  cvat_db:
  cvat_redis:
  cvat_data:
  cvat_keys:
  cvat_logs:
  cvat_iam_db:
  cvat_inmem_db:
  cvat_cache_db:
  # MLflow
  mlflow_data:

# ---------------------------------------------------------------------------
# ネットワーク定義
# ---------------------------------------------------------------------------
networks:
  mlops_net:
    driver: bridge
  cvat_net:
    driver: bridge

# ===========================================================================
# CVAT (アノテーション)
# ===========================================================================
services:

  # --- CVAT 依存サービス ---
  cvat_db:
    image: postgres:15-alpine
    container_name: cvat_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cvat
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${CVAT_DB_PASSWORD:-cvat_secret}
    volumes:
      - cvat_db:/var/lib/postgresql/data
    networks:
      - cvat_net

  cvat_redis:
    image: redis:7-alpine
    container_name: cvat_redis
    restart: unless-stopped
    networks:
      - cvat_net

  cvat_redis_inmem:
    container_name: cvat_redis_inmem
    image: redis:7.2.3-alpine
    restart: unless-stopped
    command: [
      "redis-server",
      "--save", "60", "100",
      "--appendonly", "yes",
    ]
    volumes:
      - cvat_inmem_db:/data
    networks:
      - cvat_net

  cvat_redis_ondisk:
    container_name: cvat_redis_ondisk
    image: apache/kvrocks:2.7.0
    restart: unless-stopped
    init: true
    command: [
      "--dir", "/var/lib/kvrocks/data"
    ]
    volumes:
      - cvat_cache_db:/var/lib/kvrocks/data
    networks:
      - cvat_net

  opa:
    image: openpolicyagent/opa:0.63.0
    container_name: cvat_opa
    restart: unless-stopped
    command:
      - run
      - --server
      - --log-level=error
      - --set=services.cvat.url=http://cvat-server:8080
      - --set=bundles.cvat.service=cvat
      - --set=bundles.cvat.resource=/api/auth/rules
      - --set=bundles.cvat.polling.min_delay_seconds=5
      - --set=bundles.cvat.polling.max_delay_seconds=15
    networks:
      cvat_net:
        aliases:
          - opa
      mlops_net: {}

  cvat_iam_db:
    image: postgres:15-alpine
    container_name: cvat_iam_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: iam
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${CVAT_IAM_DB_PASSWORD:-iam_secret}
    volumes:
      - cvat_iam_db:/var/lib/postgresql/data
    networks:
      - cvat_net

  # ---------------------------------------------------------------------------
  # CVAT Workers 共通環境変数
  # ---------------------------------------------------------------------------

  # --- CVAT 本体 ---
  cvat_server:
    image: cvat/server:v2.64.0
    command: run server
    container_name: cvat_server
    restart: unless-stopped
    depends_on:
      - cvat_db
      - cvat_redis
      - cvat_redis_inmem
      - cvat_redis_ondisk
      - cvat_iam_db
      - opa
    environment:
      DJANGO_MODWSGI_EXTRA_ARGS: ""
      ALLOWED_HOSTS: "*,cvat_server,cvat-server,cvat_proxy,localhost,127.0.0.1"
      CVAT_REDIS_HOST: cvat_redis
      CVAT_REDIS_PORT: "6379"
      CVAT_REDIS_INMEM_HOST: cvat_redis_inmem
      CVAT_REDIS_INMEM_PORT: "6379"
      CVAT_REDIS_ONDISK_HOST: cvat_redis_ondisk
      CVAT_REDIS_ONDISK_PORT: "6666"
      CVAT_POSTGRES_HOST: cvat_db
      CVAT_POSTGRES_USER: root
      CVAT_POSTGRES_PASSWORD: ${CVAT_DB_PASSWORD:-cvat_secret}
      CVAT_POSTGRES_DBNAME: cvat
      IAM_OIDC_PROVIDER: ""
      # 共有サーバーにする場合は .env で自分の Tailscale / LAN の URL を足す
      CSRF_TRUSTED_ORIGINS: ${CVAT_CSRF_ORIGINS:-http://localhost:8080,http://localhost,http://127.0.0.1:8080}
      UI_URL: ${CVAT_UI_URL:-http://localhost:8080}
      SMOKESCREEN_OPTS: ${SMOKESCREEN_OPTS:- }
      CVAT_SHARE_URL: /home/django/share
      NUMPROCS: "2"
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
      - ./data:/home/django/share
    networks:
      cvat_net:
        aliases:
          - cvat-server   
      mlops_net:
        aliases:
          - cvat-server 
          
  # ---------------------------------------------------------------------------
  # CVAT Workers
  # ---------------------------------------------------------------------------

  cvat_worker_export:
    image: cvat/server:v2.64.0
    container_name: cvat_worker_export
    restart: unless-stopped
    depends_on:
      - cvat_server
      - cvat_redis
      - cvat_redis_inmem
      - cvat_redis_ondisk
    environment:
      CVAT_REDIS_HOST: cvat_redis
      CVAT_REDIS_PORT: "6379"
      CVAT_REDIS_INMEM_HOST: cvat_redis_inmem
      CVAT_REDIS_INMEM_PORT: "6379"
      CVAT_REDIS_ONDISK_HOST: cvat_redis_ondisk
      CVAT_REDIS_ONDISK_PORT: "6666"
      CVAT_POSTGRES_HOST: cvat_db
      CVAT_POSTGRES_USER: root
      CVAT_POSTGRES_PASSWORD: ${CVAT_DB_PASSWORD:-cvat_secret}
      CVAT_POSTGRES_DBNAME: cvat
      SMOKESCREEN_OPTS: ${SMOKESCREEN_OPTS:- }
      NUMPROCS: "2"
    command: run worker export
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
      - ./data:/home/django/share
    networks:
      - cvat_net

  cvat_worker_import:
    image: cvat/server:v2.64.0
    container_name: cvat_worker_import
    restart: unless-stopped
    depends_on:
      - cvat_server
      - cvat_redis
      - cvat_redis_inmem
      - cvat_redis_ondisk
    environment:
      CVAT_REDIS_HOST: cvat_redis
      CVAT_REDIS_PORT: "6379"
      CVAT_REDIS_INMEM_HOST: cvat_redis_inmem
      CVAT_REDIS_INMEM_PORT: "6379"
      CVAT_REDIS_ONDISK_HOST: cvat_redis_ondisk
      CVAT_REDIS_ONDISK_PORT: "6666"
      CVAT_POSTGRES_HOST: cvat_db
      CVAT_POSTGRES_USER: root
      CVAT_POSTGRES_PASSWORD: ${CVAT_DB_PASSWORD:-cvat_secret}
      CVAT_POSTGRES_DBNAME: cvat
      SMOKESCREEN_OPTS: ${SMOKESCREEN_OPTS:- }
      NUMPROCS: "2"
    command: run worker import
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
      - ./data:/home/django/share
    networks:
      - cvat_net

  cvat_worker_annotation:
    image: cvat/server:v2.64.0
    container_name: cvat_worker_annotation
    restart: unless-stopped
    depends_on:
      - cvat_server
      - cvat_redis
      - cvat_redis_inmem
      - cvat_redis_ondisk
    environment:
      CVAT_REDIS_HOST: cvat_redis
      CVAT_REDIS_PORT: "6379"
      CVAT_REDIS_INMEM_HOST: cvat_redis_inmem
      CVAT_REDIS_INMEM_PORT: "6379"
      CVAT_REDIS_ONDISK_HOST: cvat_redis_ondisk
      CVAT_REDIS_ONDISK_PORT: "6666"
      CVAT_POSTGRES_HOST: cvat_db
      CVAT_POSTGRES_USER: root
      CVAT_POSTGRES_PASSWORD: ${CVAT_DB_PASSWORD:-cvat_secret}
      CVAT_POSTGRES_DBNAME: cvat
      SMOKESCREEN_OPTS: ${SMOKESCREEN_OPTS:- }
      NUMPROCS: "1"
    command: run worker annotation
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
      - ./data:/home/django/share
    networks:
      - cvat_net

  cvat_worker_chunks:
    image: cvat/server:v2.64.0
    container_name: cvat_worker_chunks
    restart: unless-stopped
    depends_on:
      - cvat_server
      - cvat_redis
      - cvat_redis_inmem
      - cvat_redis_ondisk
    environment:
      CVAT_REDIS_HOST: cvat_redis
      CVAT_REDIS_PORT: "6379"
      CVAT_REDIS_INMEM_HOST: cvat_redis_inmem
      CVAT_REDIS_INMEM_PORT: "6379"
      CVAT_REDIS_ONDISK_HOST: cvat_redis_ondisk
      CVAT_REDIS_ONDISK_PORT: "6666"
      CVAT_POSTGRES_HOST: cvat_db
      CVAT_POSTGRES_USER: root
      CVAT_POSTGRES_PASSWORD: ${CVAT_DB_PASSWORD:-cvat_secret}
      CVAT_POSTGRES_DBNAME: cvat
      SMOKESCREEN_OPTS: ${SMOKESCREEN_OPTS:- }
      NUMPROCS: "2"
    command: run worker chunks
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
      - ./data:/home/django/share
    networks:
      - cvat_net

  cvat_worker_utils:
    image: cvat/server:v2.64.0
    container_name: cvat_worker_utils
    restart: unless-stopped
    depends_on:
      - cvat_server
      - cvat_redis
      - cvat_redis_inmem
      - cvat_redis_ondisk
    environment:
      CVAT_REDIS_HOST: cvat_redis
      CVAT_REDIS_PORT: "6379"
      CVAT_REDIS_INMEM_HOST: cvat_redis_inmem
      CVAT_REDIS_INMEM_PORT: "6379"
      CVAT_REDIS_ONDISK_HOST: cvat_redis_ondisk
      CVAT_REDIS_ONDISK_PORT: "6666"
      CVAT_POSTGRES_HOST: cvat_db
      CVAT_POSTGRES_USER: root
      CVAT_POSTGRES_PASSWORD: ${CVAT_DB_PASSWORD:-cvat_secret}
      CVAT_POSTGRES_DBNAME: cvat
      SMOKESCREEN_OPTS: ${SMOKESCREEN_OPTS:- }
      NUMPROCS: "1"
    command: run worker notifications cleaning
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
      - ./data:/home/django/share
    networks:
      - cvat_net

  cvat_worker_quality_reports:
    image: cvat/server:v2.64.0
    container_name: cvat_worker_quality_reports
    restart: unless-stopped
    depends_on:
      - cvat_server
      - cvat_redis
      - cvat_redis_inmem
      - cvat_redis_ondisk
    environment:
      CVAT_REDIS_HOST: cvat_redis
      CVAT_REDIS_PORT: "6379"
      CVAT_REDIS_INMEM_HOST: cvat_redis_inmem
      CVAT_REDIS_INMEM_PORT: "6379"
      CVAT_REDIS_ONDISK_HOST: cvat_redis_ondisk
      CVAT_REDIS_ONDISK_PORT: "6666"
      CVAT_POSTGRES_HOST: cvat_db
      CVAT_POSTGRES_USER: root
      CVAT_POSTGRES_PASSWORD: ${CVAT_DB_PASSWORD:-cvat_secret}
      CVAT_POSTGRES_DBNAME: cvat
      SMOKESCREEN_OPTS: ${SMOKESCREEN_OPTS:- }
      NUMPROCS: "1"
    command: run worker quality_reports
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
      - ./data:/home/django/share
    networks:
      - cvat_net

  cvat_worker_webhooks:
    image: cvat/server:v2.64.0
    container_name: cvat_worker_webhooks
    restart: unless-stopped
    depends_on:
      - cvat_server
      - cvat_redis
      - cvat_redis_inmem
      - cvat_redis_ondisk
    environment:
      CVAT_REDIS_HOST: cvat_redis
      CVAT_REDIS_PORT: "6379"
      CVAT_REDIS_INMEM_HOST: cvat_redis_inmem
      CVAT_REDIS_INMEM_PORT: "6379"
      CVAT_REDIS_ONDISK_HOST: cvat_redis_ondisk
      CVAT_REDIS_ONDISK_PORT: "6666"
      CVAT_POSTGRES_HOST: cvat_db
      CVAT_POSTGRES_USER: root
      CVAT_POSTGRES_PASSWORD: ${CVAT_DB_PASSWORD:-cvat_secret}
      CVAT_POSTGRES_DBNAME: cvat
      SMOKESCREEN_OPTS: ${SMOKESCREEN_OPTS:- }
      NUMPROCS: "1"
    command: run worker webhooks
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
      - ./data:/home/django/share
    networks:
      - cvat_net

  cvat_ui:
    image: cvat/ui:v2.64.0
    container_name: cvat_ui
    restart: unless-stopped
    depends_on:
      - cvat_server
    networks:
      - cvat_net
      - mlops_net

  cvat_proxy:
    image: nginx:1.25-alpine
    container_name: cvat_proxy
    restart: unless-stopped
    depends_on:
      - cvat_ui
      - cvat_server
    ports:
      - "8080:80"   # CVAT UI → http://localhost:8080
    volumes:
      - ./nginx/cvat.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cvat_net
      - mlops_net

# ===========================================================================
# MLflow (実験管理)
# ===========================================================================

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    container_name: mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"   # MLflow UI → http://localhost:5000
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri /mlflow/mlruns
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    networks:
      - mlops_net

# ===========================================================================
# Streamlit 統合UI (YOLO学習 + FiftyOne 可視化 内包)
# ===========================================================================

  streamlit_app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: streamlit_app
    restart: unless-stopped
    ports:
      - "8501:8501"   # Streamlit UI  → http://localhost:8501
      - "5151:5151"   # FiftyOne App  → http://localhost:5151
    environment:
      # CVAT接続情報
      # 共有 CVAT を使うときは .env で上書きする（例: http://100.x.x.x:8080）
      CVAT_HOST: ${CVAT_HOST:-http://cvat-server:8080}
      # ブラウザで開くときの URL（サイドバーのリンク先）
      CVAT_WEB_HOST: ${CVAT_WEB_HOST:-http://localhost:8080}
      CVAT_USERNAME: ${CVAT_USERNAME:-admin}
      CVAT_PASSWORD: ${CVAT_PASSWORD:-admin}
      # MLflow接続情報
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # パス設定
      DATA_DIR: /workspace/data
      MODELS_DIR: /workspace/models
      PREDICTIONS_DIR: /workspace/predictions
      SERVERLESS_DIR: /workspace/serverless
      EXTENSIONS_DIR: /workspace/extensions
      # Nuclio 自動アノテーション連携
      # 関数を接続するネットワーク名 (deploy.sh は .env を読めないため明示的に渡す)
      CVAT_NETWORK: ${COMPOSE_PROJECT_NAME:-mlops_workspace}_cvat_net
      NUCLIO_DASHBOARD: http://localhost:8070
      # GPU使用設定
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      - ./data:/workspace/data
      - ./models:/workspace/models
      - ./predictions:/workspace/predictions
      - ./app:/app
      # 開発用スクリプト。app/tests/ から読めるようにするためだけのマウントで、
      # アプリの実行には使わない（コンテナ内では ROOT が / になり、
      # /app/ui/theme.py・/app/main.py を指すのでホストと同じように動く）
      - ./tools:/tools:ro
      # 別リポジトリの道具を clone して置く場所（タブが自動で増える）
      - ./extensions:/workspace/extensions
      # --- Nuclio 関数を UI からデプロイするための連携 ---
      # serverless/ 一式 (deploy.sh / function.yaml / nuctl バイナリ)
      - ./serverless:/workspace/serverless
      # ホストの dockerd に対してビルド・起動を依頼する
      - /var/run/docker.sock:/var/run/docker.sock
      # ホストの docker CLI をそのまま利用 (libc のみ依存のため再ビルド不要)
      - /usr/bin/docker:/usr/bin/docker:ro
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - mlops_net
    depends_on:
      - cvat_server
      - mlflow
