# CVAT 公式の cvat_proxy 設定を元に構成している。
#   https://github.com/cvat-ai/cvat  (Copyright (C) CVAT.ai Corporation / MIT License)

upstream cvat_backend {
    server cvat_server:8080;
}

upstream cvat_ui {
    server cvat_ui:8000;
}

server {
    listen 80;
    server_name localhost;
    # CVAT の画面は大きなファイルを 100MB ずつに分けて送る（TUS）。
    # 上限を 100M にすると、ヘッダーの分だけ超えて 413 で弾かれる。
    # サイズの制限は CVAT 側（1 ファイル 25GB まで）に任せる
    client_max_body_size 0;
    # 大きなアップロードを nginx でいったん溜め込まず、そのまま CVAT へ流す
    proxy_request_buffering off;
    # 大きなタスクの作成・書き出しで 60 秒（既定）を超えても切らない
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # バックエンド（API・管理画面・静的ファイルなど）へのルーティング
    location ~ ^/(api|git|opencv|analytics|static|admin|documentation|django-rq)/ {
        proxy_pass http://cvat_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # フロントエンド（UI画面）へのルーティング
    location / {
        proxy_pass http://cvat_ui;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}