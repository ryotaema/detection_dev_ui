# =============================================================================
# テスト（push / pull request ごと）
#
#   コンテナと同じ requirements.txt を入れ、app/tests を回す。
#   GPU は無いので torch は CPU 版を入れる（学習のテストは CPU で極小に回る）。
#   CVAT / MLflow / Nuclio には繋がないテストだけで構成している。
# =============================================================================
name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATA_DIR: ${{ github.workspace }}/.ci/data
      MODELS_DIR: ${{ github.workspace }}/.ci/models
      PREDICTIONS_DIR: ${{ github.workspace }}/.ci/predictions
      SERVERLESS_DIR: ${{ github.workspace }}/serverless
      EXTENSIONS_DIR: ${{ github.workspace }}/.ci/extensions
      # 学習のテストで MLflow サーバーを探しに行かないように
      MLFLOW_TRACKING_URI: file:${{ github.workspace }}/.ci/mlruns
      YOLO_CONFIG_DIR: ${{ github.workspace }}/.ci/ultralytics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: 依存パッケージ（torch は CPU 版）
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r app/requirements.txt

      - name: pytest
        working-directory: app
        run: python -m pytest -q

  lint-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: シェルスクリプトの構文
        run: |
          for f in tools/*.sh serverless/*.sh; do
            echo "bash -n $f"; bash -n "$f"
          done

      - name: docker compose の設定を検証する
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.serverless.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.cpu.yml config -q
